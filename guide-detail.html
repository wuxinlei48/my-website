        <h1>100m²装修预算怎么拆？</h1>
        <p class="article-meta">装修前 · 预算规划 · 云禾空间</p>
        <p>装修预算通常由人工辅材、主材设备、定制收纳、设计管理、软装预留几部分组成。真正需要提前确认的是报价边界，以及哪些项目可能后续产生增项。</p>
        <p>建议客户先确定装修档位，再逐项确认材料型号、施工范围、柜体面积、厨卫数量和旧房拆改情况。这样报价会更接近真实落地成本。</p>
